<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INKU Studio | Montage</title>
<meta name="description" content="Éditeur de montage vidéo TikTok 9:16 d'INKU Studio : timeline multipistes, 100 % dans le navigateur.">
<meta name="theme-color" content="#0f0d16">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  @font-face { font-family:'Plus Jakarta Sans'; font-weight:400; font-display:swap; src:url('../assets/fonts/plus-jakarta-sans-400.woff2') format('woff2'); }
  @font-face { font-family:'Plus Jakarta Sans'; font-weight:700; font-display:swap; src:url('../assets/fonts/plus-jakarta-sans-700.woff2') format('woff2'); }
  @font-face { font-family:'Plus Jakarta Sans'; font-weight:800; font-display:swap; src:url('../assets/fonts/plus-jakarta-sans-800.woff2') format('woff2'); }
</style>
<link rel="stylesheet" href="studio.css">
<script type="importmap">{"imports":{"mediabunny":"./vendor/mediabunny.min.mjs"}}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/></symbol>
  <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M5 3v8a7 7 0 0014 0V3h-4v8a3 3 0 01-6 0V3zM5 7h4M15 7h4"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M8 11h6"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19L17 7M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.3L21 14l-1.3.7L19 16l-.7-1.3L17 14l1.3-.7z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18h0"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol>
</defs></svg>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-weight:700;z-index:200">Chargement du Studio…</div>
<div id="compat" hidden></div>
<div id="dropHint" class="drophint">Déposez vos vidéos et audios ici</div>

<div class="studio" id="studio">
  <header class="top">
    <a class="brand" href="../index.html" style="color:inherit;text-decoration:none">INKU <b>Studio</b></a>
    <span class="proj" id="projName"></span>
    <span class="sp"></span>
    <button class="ibtn undo" id="btnUndo" aria-label="Annuler"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ibtn redo" id="btnRedo" aria-label="Rétablir"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="ibtn primary export" id="btnExport">Exporter</button>
    <span class="dur" id="dur" title="Durée totale / cible"></span>
    <span class="seg" role="group" aria-label="Mode"><button data-mode="simple">Simple</button><button data-mode="pro">Pro</button></span>
  </header>

  <section class="preview" aria-label="Aperçu">
    <div class="frame" id="frame"><div class="safe" id="safe"></div><div class="hud" id="hud">—</div></div>
  </section>

  <div class="transport">
    <button class="ibtn" id="btnPrev" aria-label="Image précédente"><svg class="i"><use href="#i-prev"/></svg></button>
    <button class="ibtn primary" id="btnPlay" aria-label="Lecture / pause" style="border-radius:99px;min-width:56px"><svg class="i"><use href="#i-play"/></svg></button>
    <button class="ibtn" id="btnNext" aria-label="Image suivante"><svg class="i"><use href="#i-next"/></svg></button>
    <span class="tc" id="tc">00:00:00</span>
    <button class="ibtn" id="btnSafe" aria-label="Zone de sécurité TikTok" title="Zone de sécurité TikTok" style="font-size:.7rem;font-weight:800">9:16</button>
  </div>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-tools" role="toolbar" aria-label="Outils de montage">
      <button class="ibtn" id="tCut" aria-label="Couper à la tête de lecture" title="Couper (C)"><svg class="i"><use href="#i-cut"/></svg></button>
      <button class="ibtn" id="tDel" aria-label="Supprimer" title="Supprimer (Suppr)"><svg class="i"><use href="#i-trash"/></svg></button>
      <button class="ibtn" id="tDup" aria-label="Dupliquer" title="Dupliquer (Ctrl+D)" style="font-weight:800;font-size:.7rem">⧉</button>
      <button class="ibtn" id="tSnap" aria-label="Magnétisme" title="Magnétisme"><svg class="i"><use href="#i-magnet"/></svg></button>
      <button class="ibtn" id="tRipple" aria-label="Recalage (ripple)" title="Recalage des clips suivants" style="font-size:.66rem;font-weight:800">Ripple</button>
      <button class="ibtn" id="tRoll" aria-label="Roll" title="Roll : déplace la coupe entre deux clips" style="font-size:.66rem;font-weight:800;display:none">Roll</button>
      <button class="ibtn" id="tMulti" aria-label="Sélection multiple" title="Sélection multiple" style="font-weight:800">☑</button>
      <button class="ibtn" id="tMark" aria-label="Marqueur" title="Marqueur (M)"><svg class="i"><use href="#i-flag"/></svg></button>
      <span class="sp"></span>
      <button class="ibtn" id="tZout" aria-label="Zoom arrière"><svg class="i"><use href="#i-zout"/></svg></button>
      <button class="ibtn" id="tZin" aria-label="Zoom avant"><svg class="i"><use href="#i-zin"/></svg></button>
      <button class="ibtn" id="tFit" aria-label="Tout afficher" style="font-size:.66rem;font-weight:800">Tout</button>
    </div>
    <div class="tl-scroll" id="tlScroll"><div class="tl-content" id="tlContent"></div></div>
  </section>

  <nav class="dock" aria-label="Actions rapides">
    <button data-sheet="sheetSources"><svg class="i"><use href="#i-lib"/></svg>Sources</button>
    <button id="dCut"><svg class="i"><use href="#i-cut"/></svg>Couper</button>
    <button id="dDup" style="font-size:.62rem"><span style="font-size:1.2rem;line-height:20px">⧉</span>Dupliquer</button>
    <button id="dDel"><svg class="i"><use href="#i-trash"/></svg>Supprimer</button>
    <button data-sheet="sheetProps"><svg class="i"><use href="#i-sliders"/></svg>Réglages</button>
  </nav>

  <aside class="sheet" id="sheetSources" aria-label="Sources">
    <div class="grab"></div>
    <div class="panel-h">Sources<span class="sp"></span><button class="ibtn primary" data-import style="min-height:34px">Importer</button><button class="ibtn close-sheet" data-close aria-label="Fermer">✕</button></div>
    <div class="panel-b" id="binBody"></div>
    <div class="panel-h" style="font-size:.62rem;text-transform:none;letter-spacing:0"><span id="storage"></span></div>
  </aside>

  <aside class="sheet" id="sheetProps" aria-label="Propriétés">
    <div class="grab"></div>
    <div class="panel-h"><span id="propsTitle">Projet</span><span class="sp"></span><span id="saveState" style="text-transform:none;letter-spacing:0;font-size:.64rem;margin-right:6px"></span><button class="ibtn close-sheet" data-close aria-label="Fermer">✕</button></div>
    <div class="panel-b" id="propsBody"></div>
  </aside>
</div>
<input type="file" id="filePicker" multiple accept="video/*,audio/*,.mp4,.mov,.m4v,.webm,.mkv,.mp3,.wav,.m4a,.aac,.ogg,.flac" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="coi-register.js"></script>
<script type="module" src="studio/app.js"></script>
</body>
</html>
